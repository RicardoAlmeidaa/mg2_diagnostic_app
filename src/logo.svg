<svg viewBox="0 0 192 192" width="192" height="192">
  <!-- Fundo Escuro (baseado no tema da app) -->
  <rect width="192" height="192" rx="44" fill="#13181e" />

  <!-- Efeito de brilho subtil no fundo -->
  <circle cx="96" cy="85" r="50" fill="#00f5d4" opacity="0.1" />

  <!-- Círculo Exterior (Lente/Foco) -->
  <circle cx="96" cy="85" r="56" fill="none" stroke="#0d9488" stroke-width="4" />

  <!-- Círculo Interior Tracejado (ROI) -->
  <circle cx="96" cy="85" r="46" fill="none" stroke="#00f5d4" stroke-width="3" stroke-dasharray="8 8" />

  <!-- Texto Central (Magnésio) -->
  <text x="96" y="102" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" fill="#ffffff" text-anchor="middle">Mg</text>

  <!-- Nome da App -->
  <text x="96" y="164" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#00f5d4" text-anchor="middle">MagCare</text>
</svg>